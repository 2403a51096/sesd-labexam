
<!DOCTYPE html>
<html>
<head>
    <title>Hospital Appointment System</title>
    <style>
        body {
            font-family: Arial;
            background-color: #eaf4f4;
            text-align: center;
        }

        h1 {
            background-color: teal;
            color: white;
            padding: 20px;
        }

        .doctor {
            background: white;
            margin: 20px auto;
            padding: 15px;
            width: 350px;
            border-radius: 10px;
        }

        button {
            background: teal;
            color: white;
            padding: 10px;
            border: none;
        }
    </style>
</head>

<body>

<h1>City Care Hospital</h1>

<h2>Available Doctors</h2>

<div class="doctor">
    <h3>Dr. Ravi Kumar</h3>
    <p>Specialization: Cardiologist</p>
    <p>Timing: 10 AM - 1 PM</p>
    <button onclick="alert('Appointment booked!')">
        Book Appointment
    </button>
</div>

<div class="doctor">
    <h3>Dr. Priya Sharma</h3>
    <p>Specialization: Dermatologist</p>
    <p>Timing: 2 PM - 5 PM</p>
    <button onclick="alert('Appointment booked!')">
        Book Appointment
    </button>
</div>

<div class="doctor">
    <h3>Dr. Arjun Reddy</h3>
    <p>Specialization: Neurologist</p>
    <p>Timing: 9 AM - 12 PM</p>
    <button onclick="alert('Appointment booked!')">
        Book Appointment
    </button>
</div>

</body>
</html>
